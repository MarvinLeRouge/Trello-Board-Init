name: Update changelog

on:
  push:
    branches: [main]
    paths-ignore:
      - CHANGELOG.md

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate changelog
        run: npx --yes git-cliff --config cliff.toml --output CHANGELOG.md

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update changelog"
          title: "chore: update changelog"
          body: Automated changelog update generated from conventional commits via git-cliff.
          branch: chore/update-changelog
          delete-branch: true
